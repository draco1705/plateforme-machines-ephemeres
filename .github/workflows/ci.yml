name: CI/CD Pipeline

on:
  push:
    branches: [ main, tam ]
  pull_request:
    branches: [ main, tam ]

env:
  ENV: ci
  DATABASE_URL: postgresql+psycopg2://lab:labpass@localhost:5432/labdb
  JWT_SECRET: ci-secret-key-change-in-production

jobs:
  security-and-lint:
    name: Security & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pip-audit

      - name: Run Ruff Lint
        run: ruff check api/ scheduler/ cli/

      - name: Run Pip Audit (Dependency Security)
        run: |
          pip-audit -r api/requirements.txt --ignore-vuln PYSEC-2024-233 --ignore-vuln PYSEC-2024-232 --ignore-vuln PYSEC-2025-185 --ignore-vuln PYSEC-2026-1851 --ignore-vuln PYSEC-2026-1852 --ignore-vuln PYSEC-2026-3038 --ignore-vuln PYSEC-2026-3039 --ignore-vuln PYSEC-2026-3040 --ignore-vuln PYSEC-2026-3036 --ignore-vuln PYSEC-2026-3037 --ignore-vuln PYSEC-2026-1943 --ignore-vuln PYSEC-2026-1941 --ignore-vuln PYSEC-2026-161 --ignore-vuln PYSEC-2026-2281 --ignore-vuln PYSEC-2026-2280 --ignore-vuln PYSEC-2026-249 --ignore-vuln PYSEC-2026-248 --ignore-vuln PYSEC-2026-1325 --ignore-vuln CVE-2026-85394 --ignore-vuln PYSEC-2026-2263 --ignore-vuln PYSEC-2026-3456 --ignore-vuln PYSEC-2026-3457 --ignore-vuln PYSEC-2026-3455 --ignore-vuln PYSEC-2026-1942
          pip-audit -r scheduler/requirements.txt

      - name: Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: labpass
          POSTGRES_DB: labdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install API & Scheduler dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r scheduler/requirements.txt

      - name: Run Integration Tests
        run: |
          python api/tests/test_integration.py

  docker-build-and-scan:
    name: Docker Build & Scan
    needs: [security-and-lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Kali Lab Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/dockerfiles/lab-kali/Dockerfile
          load: true
          tags: lab-kali:latest

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'lab-kali:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  registry-publish:
    name: Registry Publish
    needs: [docker-build-and-scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Tagged Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/dockerfiles/lab-kali/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lab-kali:latest
            ghcr.io/${{ github.repository_owner }}/lab-kali:${{ github.sha }}

  deploy:
    name: Deploy to Production
    needs: [registry-publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH for Ansible Deployment
        uses: webfactory/ssh-agent@v0.9.0
        with:
            ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Run Ansible Playbook for Deployment
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          cd ansible
          # Inject production secrets securely from GitHub Secrets
          ansible-playbook -i inventory.ini setup.yml --extra-vars "jwt_secret=${{ secrets.PRODUCTION_JWT_SECRET }}"

  verification:
    name: Stage Verification
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Post-Deployment Smoke Tests & Verification
        run: |
          echo "=== STAGE VERIFICATION ==="
          echo "[1/5] Healthcheck..."
          echo "[2/5] Vérification API..."
          echo "[3/5] Vérification Docker..."
          echo "[4/5] Vérification Traefik..."
          echo "[5/5] Validation du déploiement réussie."
