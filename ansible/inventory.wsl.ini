[controllers]
controller ansible_host=192.168.56.10 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/vagrant_keys/controller_key

[workers]
worker1 ansible_host=192.168.56.11 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/vagrant_keys/worker1_key
worker2 ansible_host=192.168.56.12 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/vagrant_keys/worker2_key
worker3 ansible_host=192.168.56.13 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/vagrant_keys/worker3_key

[cluster:children]
controllers
workers

[cluster:vars]
ansible_user=vagrant
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'